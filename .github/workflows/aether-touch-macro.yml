name: Build AETHER Touch Macro

on:
  workflow_dispatch:
  push:
    paths:
      - "extras/aether-touch-macro/**"
      - ".github/workflows/aether-touch-macro.yml"
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extras/aether-touch-macro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Build Fabric mod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-Touch-Macro-MC-1.21.0
          path: extras/aether-touch-macro/build/libs/*.jar
