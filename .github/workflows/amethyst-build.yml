name: Build Aether Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/amethyst-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Fix Git SSH URLs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Download Amethyst Engine
        run: |
          git clone --branch v3_openjdk --recursive https://github.com/AngelAuraMC/Amethyst-Android.git amethyst

      - name: Rebrand app as Aether
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          res = Path("amethyst/app_pojavlauncher/src/main/res")
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)

          # Create the Aether backgrounds referenced by the patched layouts/theme.
          (drawable / "aether_wallpaper.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="135" android:startColor="#101B2B" android:centerColor="#17263B" android:endColor="#0B1420" />
          </shape>
          """)
          (drawable / "aether_card.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#E61B2B40" />
              <stroke android:width="1dp" android:color="#5539C6D8" />
              <corners android:radius="14dp" />
          </shape>
          """)

          # Apply the app name to every language, including Indonesian.
          for p in res.glob("values*/strings.xml"):
              s = p.read_text()
              s = re.sub(
                  r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                  r'\g<1>Aether Launcher\g<2>',
                  s,
                  flags=re.S
              )
              s = s.replace("Amethyst", "Aether Launcher")
              p.write_text(s)

          # Give the launcher a restrained midnight-and-cyan Aether palette.
          colors = res / "values/colors.xml"
          s = colors.read_text()
          palette = {
              "minebutton_color": "#12AFC0",
              "background_app": "#101923",
              "background_overlay": "#263744",
              "background_status_bar": "#0B1420",
              "background_bottom_bar": "#15232F",
              "primary_text": "#F4FAFC",
              "secondary_text": "#A9BBC5",
          }
          for name, value in palette.items():
              s = re.sub(
                  rf'(<color name="{name}">).*?(</color>)',
                  rf'\g<1>{value}\g<2>',
                  s,
                  count=1
              )
          if 'name="aether_icon_background"' not in s:
              s = s.replace("</resources>", '    <color name="aether_icon_background">#101923</color>\n</resources>')
          colors.write_text(s)

          # Carry the Aether accent through the launcher and settings screens.
          styles = res / "values/styles.xml"
          if styles.exists():
              t = styles.read_text()
              anchor = '<item name="preferenceTheme">@style/PreferenceThemeOverlay.v14.Material</item>'
              additions = anchor + '\n        <item name="colorAccent">#12AFC0</item>\n        <item name="colorControlActivated">#12AFC0</item>\n        <item name="android:colorAccent">#12AFC0</item>'
              if 'name="colorAccent"' not in t:
                  t = t.replace(anchor, additions)
              if 'name="android:windowBackground"' not in t:
                  t = t.replace('</style>', '        <item name="android:windowBackground">@drawable/aether_wallpaper</item>\n    </style>', 1)
              styles.write_text(t)

          # Give the account/settings bar the same Aether glass treatment.
          activity_layout = res / "layout/activity_pojav_launcher.xml"
          if activity_layout.exists():
              t = activity_layout.read_text()
              t = t.replace('android:background="@android:color/transparent"', 'android:background="@drawable/aether_wallpaper"', 1)
              t = t.replace('android:dropDownVerticalOffset="@dimen/_52sdp"', 'android:dropDownVerticalOffset="@dimen/_52sdp"\n        android:background="@drawable/aether_card"', 1)
              t = t.replace('android:background="?attr/selectableItemBackground"', 'android:background="@drawable/aether_card"', 1)
              # Add the Aether navigation rail to the activity shell.
              rail = """<LinearLayout
                  android:id="@+id/aether_nav_rail"
                  android:layout_width="68dp"
                  android:layout_height="0dp"
                  android:orientation="vertical"
                  android:gravity="center_horizontal"
                  android:paddingTop="12dp"
                  android:background="#F20B1426"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toBottomOf="parent">
                  <TextView android:layout_width="44dp" android:layout_height="44dp"
                      android:gravity="center" android:text="A" android:textSize="24sp"
                      android:textStyle="bold" android:textColor="#FFFFFF"
                      android:background="@drawable/aether_card"/>
                  <TextView android:id="@+id/aether_nav_home" android:layout_width="match_parent"
                      android:layout_height="64dp" android:layout_marginTop="18dp"
                      android:gravity="center" android:text="⌂&#10;Home" android:textSize="11sp"
                      android:textColor="#65D8E5" android:clickable="true" android:focusable="true"
                      android:background="?attr/selectableItemBackground"/>
                  <TextView android:id="@+id/aether_nav_versions" android:layout_width="match_parent"
                      android:layout_height="64dp" android:gravity="center" android:text="▣&#10;Versions"
                      android:textSize="11sp" android:textColor="#C3D2E5" android:clickable="true"
                      android:focusable="true" android:background="?attr/selectableItemBackground"/>
                  <TextView android:id="@+id/aether_nav_mods" android:layout_width="match_parent"
                      android:layout_height="64dp" android:gravity="center" android:text="▧&#10;Mods"
                      android:textSize="11sp" android:textColor="#C3D2E5" android:clickable="true"
                      android:focusable="true" android:background="?attr/selectableItemBackground"/>
                  <TextView android:id="@+id/aether_nav_controls" android:layout_width="match_parent"
                      android:layout_height="64dp" android:gravity="center" android:text="⌗&#10;Control"
                      android:textSize="11sp" android:textColor="#C3D2E5" android:clickable="true"
                      android:focusable="true" android:background="?attr/selectableItemBackground"/>
                  <TextView android:id="@+id/aether_nav_settings" android:layout_width="match_parent"
                      android:layout_height="64dp" android:gravity="center" android:text="⚙&#10;Settings"
                      android:textSize="11sp" android:textColor="#C3D2E5" android:clickable="true"
                      android:focusable="true" android:background="?attr/selectableItemBackground"/>
              </LinearLayout>
              """
              t = t.replace('<com.kdt.mcgui.mcAccountSpinner', rail + '\n    <com.kdt.mcgui.mcAccountSpinner', 1)

              # Correctly size the main content beside the rail.
              def patch_view(xml, tag, view_id, width, extra_attrs):
                  pattern = r"(<" + re.escape(tag) + r"\b[^>]*android:id=\"@\+id/" + re.escape(view_id) + r"\"[^>]*>)"
                  match = re.search(pattern, xml, flags=re.S)
                  if not match:
                      return xml
                  view = match.group(1)
                  view = re.sub(r'android:layout_width="[^"]+"', 'android:layout_width="' + width + '"', view, count=1)
                  for attr, value in extra_attrs.items():
                      if attr in view:
                          view = re.sub(re.escape(attr) + r'="[^"]*"', attr + '="' + value + '"', view, count=1)
                      else:
                          view = view[:-2] + '\n        ' + attr + '="' + value + '" />'
                  return xml[:match.start()] + view + xml[match.end():]

              t = patch_view(t, "com.kdt.mcgui.mcAccountSpinner", "account_spinner", "0dp", {
                  "app:layout_constraintStart_toEndOf": "@id/aether_nav_rail",
                  "app:layout_constraintEnd_toStartOf": "@id/setting_button"})
              t = patch_view(t, "androidx.fragment.app.FragmentContainerView", "container_fragment", "0dp", {
                  "app:layout_constraintStart_toEndOf": "@id/aether_nav_rail",
                  "app:layout_constraintEnd_toEndOf": "parent"})
              t = patch_view(t, "com.kdt.mcgui.ProgressLayout", "progress_layout", "0dp", {
                  "app:layout_constraintStart_toEndOf": "@id/aether_nav_rail",
                  "app:layout_constraintEnd_toEndOf": "parent"})
              activity_layout.write_text(t)

          # Replace the stock home screen with the Aether dashboard while preserving
          # every view ID used by the original launcher logic.
          menu_layout = res / "layout/fragment_launcher.xml"
          if menu_layout.exists():
              menu_layout.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/fragment_menu_main"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/aether_wallpaper">
              <ScrollView
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:fillViewport="true"
                  android:clipToPadding="false"
                  android:padding="14dp"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toTopOf="@id/mc_version_spinner"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="190dp"
                          android:orientation="vertical"
                          android:gravity="bottom"
                          android:padding="20dp"
                          android:background="@drawable/aether_card">
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="AETHER LAUNCHER"
                              android:textColor="#62DCEB"
                              android:textStyle="bold"
                              android:textSize="12sp"
                              android:letterSpacing="0.16" />
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="8dp"
                              android:text="MINECRAFT JAVA EDITION"
                              android:textColor="#FFFFFF"
                              android:textStyle="bold"
                              android:textSize="23sp" />
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="5dp"
                              android:text="Your world. Your rules."
                              android:textColor="#B8CAD8"
                              android:textSize="13sp" />
                      </LinearLayout>
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="18dp"
                          android:layout_marginBottom="8dp"
                          android:text="SYSTEM STATUS"
                          android:textColor="#D8E8F4"
                          android:textStyle="bold"
                          android:textSize="12sp"
                          android:letterSpacing="0.12" />
                      <LinearLayout
                          android:id="@+id/aether_status_row"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">
                          <TextView
                              android:id="@+id/aether_ram_value"
                              android:layout_width="0dp"
                              android:layout_height="76dp"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:textColor="#F4FAFC"
                              android:textSize="12sp"
                              android:background="@drawable/aether_card" />
                          <TextView
                              android:id="@+id/aether_java_value"
                              android:layout_width="0dp"
                              android:layout_height="76dp"
                              android:layout_marginStart="7dp"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:textColor="#F4FAFC"
                              android:textSize="12sp"
                              android:background="@drawable/aether_card" />
                          <TextView
                              android:id="@+id/aether_renderer_value"
                              android:layout_width="0dp"
                              android:layout_height="76dp"
                              android:layout_marginStart="7dp"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:textColor="#F4FAFC"
                              android:textSize="12sp"
                              android:background="@drawable/aether_card" />
                      </LinearLayout>
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="18dp"
                          android:layout_marginBottom="8dp"
                          android:text="QUICK ACCESS"
                          android:textColor="#D8E8F4"
                          android:textStyle="bold"
                          android:textSize="12sp"
                          android:letterSpacing="0.12" />
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">
                          <Button
                              android:id="@+id/news_button"
                              android:layout_width="0dp"
                              android:layout_height="54dp"
                              android:layout_weight="1"
                              android:text="News & Wiki"
                              android:textColor="#F4FAFC"
                              android:background="@drawable/aether_card" />
                          <Button
                              android:id="@+id/discord_button"
                              android:layout_width="0dp"
                              android:layout_height="54dp"
                              android:layout_marginStart="8dp"
                              android:layout_weight="1"
                              android:text="Community"
                              android:textColor="#F4FAFC"
                              android:background="@drawable/aether_card" />
                      </LinearLayout>
                      <Button
                          android:id="@+id/custom_control_button"
                          android:layout_width="match_parent"
                          android:layout_height="54dp"
                          android:layout_marginTop="8dp"
                          android:text="Custom Controls"
                          android:textColor="#F4FAFC"
                          android:background="@drawable/aether_card" />
                      <Button
                          android:id="@+id/install_jar_button"
                          android:layout_width="match_parent"
                          android:layout_height="54dp"
                          android:layout_marginTop="8dp"
                          android:text="Install JAR / Mod"
                          android:textColor="#F4FAFC"
                          android:background="@drawable/aether_card" />
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="horizontal">
                          <Button
                              android:id="@+id/share_logs_button"
                              android:layout_width="0dp"
                              android:layout_height="50dp"
                              android:layout_weight="1"
                              android:text="Share Logs"
                              android:textColor="#F4FAFC"
                              android:background="@drawable/aether_card" />
                          <Button
                              android:id="@+id/open_files_button"
                              android:layout_width="0dp"
                              android:layout_height="50dp"
                              android:layout_marginStart="8dp"
                              android:layout_weight="1"
                              android:text="Game Files"
                              android:textColor="#F4FAFC"
                              android:background="@drawable/aether_card" />
                      </LinearLayout>
                  </LinearLayout>
              </ScrollView>
              <com.kdt.mcgui.mcVersionSpinner
                  android:id="@+id/mc_version_spinner"
                  android:layout_width="0dp"
                  android:layout_height="52dp"
                  android:background="@drawable/aether_card"
                  android:drawableEnd="@drawable/spinner_arrow"
                  app:drawableEndSize="@dimen/padding_heavy"
                  app:drawableStartIntegerScaling="true"
                  app:drawableStartSize="@dimen/_36sdp"
                  app:drawableEndPadding="@dimen/_1sdp"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toStartOf="@id/edit_profile_button"
                  app:layout_constraintBottom_toTopOf="@id/play_button" />
              <ImageButton
                  android:id="@+id/edit_profile_button"
                  android:layout_width="52dp"
                  android:layout_height="52dp"
                  android:background="@drawable/aether_card"
                  android:src="@drawable/ic_edit_profile"
                  android:contentDescription="Edit Minecraft profile"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintBottom_toBottomOf="@id/mc_version_spinner"
                  app:layout_constraintTop_toTopOf="@id/mc_version_spinner" />
              <com.kdt.mcgui.MineButton
                  android:id="@+id/play_button"
                  android:layout_width="match_parent"
                  android:layout_height="62dp"
                  android:layout_marginHorizontal="17dp"
                  android:layout_marginBottom="12dp"
                  android:textAllCaps="true"
                  android:text="PLAY"
                  app:layout_constraintBottom_toBottomOf="parent" />
          </androidx.constraintlayout.widget.ConstraintLayout>
          """)
          
          menu_java = Path("amethyst/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/fragments/MainMenuFragment.java")
          if menu_java.exists():
              j = menu_java.read_text()
              anchor = '        mVersionSpinner = view.findViewById(R.id.mc_version_spinner);'
              status = "\n".join([
                  '        android.widget.TextView heapInfo = view.findViewById(R.id.aether_ram_value);',
                  '        android.widget.TextView javaInfo = view.findViewById(R.id.aether_java_value);',
                  '        android.widget.TextView rendererInfo = view.findViewById(R.id.aether_renderer_value);',
                  '        int ramMb = LauncherPreferences.PREF_RAM_ALLOCATION;',
                  '        heapInfo.setText("RAM\\n" + ramMb + " MB");',
                  '        javaInfo.setText("JAVA\\n" + System.getProperty("java.version", "Unknown"));',
                  '        rendererInfo.setText("RENDERER\\nConfigure in Settings");'])
              if "aether_ram_value" not in j:
                  j = j.replace(anchor, anchor + "\n" + status, 1)
              if "openAetherVersionEditor" not in j:
                  closing = j.rfind("}")
                  method = "\n".join([
                      "    public void openAetherVersionEditor() {",
                      "        if (mVersionSpinner != null) mVersionSpinner.openProfileEditor(requireActivity());",
                      "    }",
                  ])
                  j = j[:closing] + method + "\n" + j[closing:]
              menu_java.write_text(j)

          launcher_java = Path("amethyst/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/LauncherActivity.java")
          if launcher_java.exists():
              j = launcher_java.read_text()
              anchor = '        mSettingsButton.setOnClickListener(mSettingButtonListener);'
              wiring = anchor + """
                  findViewById(R.id.aether_nav_home).setOnClickListener(v -> Tools.backToMainMenu(this));
                  findViewById(R.id.aether_nav_settings).setOnClickListener(mSettingButtonListener);
                  findViewById(R.id.aether_nav_versions).setOnClickListener(v -> {
                      Fragment current = getSupportFragmentManager().findFragmentById(mFragmentView.getId());
                      if (current instanceof MainMenuFragment) ((MainMenuFragment) current).openAetherVersionEditor();
                      else Tools.backToMainMenu(this);
                  });
                  findViewById(R.id.aether_nav_controls).setOnClickListener(v ->
                          startActivity(new android.content.Intent(this, CustomControlsActivity.class)));
                  findViewById(R.id.aether_nav_mods).setOnClickListener(v -> Tools.installMod(this, false));"""
              if 'aether_nav_home' not in j:
                  j = j.replace(anchor, wiring, 1)
              launcher_java.write_text(j)

          PY

      - name: Build APK
        run: |
          cd amethyst
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug

      - name: Upload Aether APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Launcher-APK
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk
