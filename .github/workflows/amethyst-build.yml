name: Build Aether Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/amethyst-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Fix Git SSH URLs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Download Amethyst Engine
        run: |
          git clone --branch v3_openjdk --recursive https://github.com/AngelAuraMC/Amethyst-Android.git amethyst

      - name: Rebrand app as Aether
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          res = Path("amethyst/app_pojavlauncher/src/main/res")

          # Apply the app name to every language, including Indonesian.
          for p in res.glob("values*/strings.xml"):
              s = p.read_text()
              s = re.sub(
                  r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                  r'\g<1>Aether Launcher\g<2>',
                  s,
                  flags=re.S
              )
              s = s.replace("Amethyst", "Aether Launcher")
              p.write_text(s)

          # Give the launcher a restrained midnight-and-cyan Aether palette.
          colors = res / "values/colors.xml"
          s = colors.read_text()
          palette = {
              "minebutton_color": "#12AFC0",
              "background_app": "#101923",
              "background_overlay": "#263744",
              "background_status_bar": "#0B1420",
              "background_bottom_bar": "#15232F",
              "primary_text": "#F4FAFC",
              "secondary_text": "#A9BBC5",
          }
          for name, value in palette.items():
              s = re.sub(
                  rf'(<color name="{name}">).*?(</color>)',
                  rf'\g<1>{value}\g<2>',
                  s,
                  count=1
              )
          if 'name="aether_icon_background"' not in s:
              s = s.replace("</resources>", '    <color name="aether_icon_background">#101923</color>\n</resources>')
          colors.write_text(s)

          # Carry the Aether accent through the launcher and settings screens.
          styles = res / "values/styles.xml"
          if styles.exists():
              t = styles.read_text()
              anchor = '<item name="preferenceTheme">@style/PreferenceThemeOverlay.v14.Material</item>'
              additions = anchor + '\n        <item name="colorAccent">#12AFC0</item>\n        <item name="colorControlActivated">#12AFC0</item>\n        <item name="android:colorAccent">#12AFC0</item>'
              if 'name="colorAccent"' not in t:
                  t = t.replace(anchor, additions)
              styles.write_text(t)

          # Give the account/settings bar the same Aether glass treatment.
          activity_layout = res / "layout/activity_pojav_launcher.xml"
          if activity_layout.exists():
              t = activity_layout.read_text()
              t = t.replace('android:background="@android:color/transparent"', 'android:background="@drawable/aether_wallpaper"', 1)
              t = t.replace('android:dropDownVerticalOffset="@dimen/_52sdp"', 'android:dropDownVerticalOffset="@dimen/_52sdp"\n        android:background="@drawable/aether_card"', 1)
              t = t.replace('android:background="?attr/selectableItemBackground"', 'android:background="@drawable/aether_card"', 1)
              activity_layout.write_text(t)

          # Replace the stock Amethyst adaptive launcher icon with an original Aether mark.
          foreground = res / "drawable/ic_aether_foreground.xml"
          foreground.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#12AFC0"
                  android:pathData="M54,15 L91,88 L76,88 L54,45 L32,88 L17,88 Z"/>
              <path android:fillColor="#F4FAFC"
                  android:pathData="M39,66 L69,66 L76,79 L32,79 Z"/>
              <path android:fillColor="#101923"
                  android:pathData="M49,56 L59,56 L65,68 L43,68 Z"/>
          </vector>
          """)
          adaptive = res / "mipmap-anydpi-v26/ic_launcher.xml"
          adaptive.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/aether_icon_background"/>
              <foreground android:drawable="@drawable/ic_aether_foreground"/>
          </adaptive-icon>
          """)
          # Keep the round adaptive icon consistent as well.
          round_icon = res / "mipmap-anydpi-v26/ic_launcher_round.xml"
          if round_icon.exists():
              round_icon.write_text(adaptive.read_text())
          # Aether visual layer: a deep twilight gradient and softer glass-like panels.
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "aether_wallpaper.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape android:shape="rectangle"><gradient android:angle="135" android:startColor="#080F20" android:centerColor="#17233D" android:endColor="#090D1B" android:type="linear"/></shape></item>
              <item android:gravity="top|right"><shape android:shape="rectangle"><size android:width="220dp" android:height="220dp"/><corners android:bottomLeftRadius="220dp"/><solid android:color="#302B55A8"/></shape></item>
              <item android:gravity="bottom|left"><shape android:shape="rectangle"><size android:width="260dp" android:height="260dp"/><corners android:topRightRadius="260dp"/><solid android:color="#302A1C66"/></shape></item>
          </layer-list>""")
          (drawable / "aether_panel.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="12dp"/>
              <gradient android:angle="135" android:startColor="#D91C2C4A" android:endColor="#D9101A30"/>
              <stroke android:width="1dp" android:color="#554C8DFF"/>
          </shape>""")
          # Keep the launcher controls and navigation intact; only refresh their visual surfaces.
          for layout in [
              res / "layout/fragment_launcher.xml",
              res / "layout-land/fragment_launcher.xml",
          ]:
              if layout.exists():
                  s = layout.read_text()
                  s = s.replace('android:background="@color/background_app"', 'android:background="@drawable/aether_wallpaper"', 1)
                  layout.write_text(s)


          # Replace the stock launcher home with an Aether dashboard.
          # Keep every original view ID used by LauncherActivity so existing
          # account/version/play/control handlers remain connected.
          card = drawable / "aether_card.xml"
          card.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="18dp"/>
              <gradient android:angle="135" android:startColor="#E51B2B49" android:endColor="#E50C172A"/>
              <stroke android:width="1dp" android:color="#665D8FFF"/>
          </shape>""")
          # Original block-world landscape artwork for the Aether home screen.
          (drawable / "aether_world.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="1080dp" android:height="1920dp"
              android:viewportWidth="1080" android:viewportHeight="1920">
              <path android:fillColor="#101B35" android:pathData="M0,0h1080v1920h-1080z"/>
              <path android:fillColor="#243B66" android:pathData="M0,0h1080v820h-1080z"/>
              <path android:fillColor="#526D91" android:pathData="M0,650l180,0 0,-90 90,0 0,-90 90,0 0,90 90,0 0,-150 90,0 0,-80 90,0 0,80 90,0 0,90 90,0 0,90 90,0 0,260h-1080z"/>
              <path android:fillColor="#D8E9F1" android:pathData="M270,560l90,0 0,90 90,0 0,90 -180,0z M540,410l90,0 0,90 90,0 0,90 -180,0z"/>
              <path android:fillColor="#263F42" android:pathData="M0,820h1080v1100h-1080z"/>
              <path android:fillColor="#315B4D" android:pathData="M0,790h180v90h180v-70h180v100h180v-80h180v60h180v180h-1080z"/>
              <path android:fillColor="#47775A" android:pathData="M0,980h180v90h180v-90h180v130h180v-90h180v90h180v810h-1080z"/>
              <path android:fillColor="#1A3440" android:pathData="M0,1330h1080v590h-1080z"/>
              <path android:fillColor="#315E70" android:pathData="M0,1410h180v-45h180v45h180v-45h180v45h180v-45h180v555h-1080z"/>
              <path android:fillColor="#6BA0A0" android:pathData="M0,1500h1080v26h-1080z M0,1650h1080v18h-1080z M0,1800h1080v22h-1080z"/>
              <path android:fillColor="#F1D9A0" android:pathData="M790,220a92,92 0,1 0,184 0a92,92 0,1 0,-184 0"/>
              <path android:fillColor="#182B36" android:pathData="M130,740h34v-140h34v140h34v140h-102z M150,600h62v-70h-62z M900,760h34v-150h34v150h34v130h-102z M920,610h62v-70h-62z"/>
              <path android:fillColor="#6D9B69" android:pathData="M100,880h120v-60h-120z M870,900h120v-60h-120z M430,1050h90v-50h-90z"/>
          </vector>
          """)
          (drawable / "aether_hero.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/aether_world"/>
              <item><shape android:shape="rectangle"><gradient android:angle="90" android:startColor="#66101A30" android:centerColor="#99101A30" android:endColor="#F20C172A"/></shape></item>
              <item><shape android:shape="rectangle"><corners android:radius="18dp"/><stroke android:width="1dp" android:color="#775D8FFF"/></shape></item>
          </layer-list>
          """)
          home_xml = """<?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/fragment_menu_main"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/aether_wallpaper">
              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:fillViewport="true"
                  android:clipToPadding="false"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp"
                  android:paddingTop="12dp"
                  android:paddingBottom="12dp"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toTopOf="@id/aether_bottom_area">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="AETHER LAUNCHER"
                          android:textColor="#F5FAFF"
                          android:textStyle="bold"
                          android:textSize="22sp"
                          android:letterSpacing="0.12"
                          android:paddingTop="8dp"/>
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="MINECRAFT JAVA EDITION"
                          android:textColor="#91B8D4"
                          android:textStyle="bold"
                          android:textSize="11sp"
                          android:letterSpacing="0.16"
                          android:paddingTop="3dp"
                          android:paddingBottom="16dp"/>
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="18dp"
                          android:background="@drawable/aether_hero">
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="YOUR NEXT WORLD"
                              android:textColor="#73D9E7"
                              android:textStyle="bold"
                              android:textSize="10sp"
                              android:letterSpacing="0.14"/>
                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Ready to play?"
                              android:textColor="#FFFFFF"
                              android:textStyle="bold"
                              android:textSize="25sp"
                              android:paddingTop="8dp"/>
                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Your Minecraft Java adventure starts here."
                              android:textColor="#C2D1E2"
                              android:textSize="13sp"
                              android:paddingTop="4dp"
                              android:paddingBottom="14dp"/>
                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Choose a version below, then launch the game."
                              android:textColor="#91AFC8"
                              android:textSize="12sp"/>
                      </LinearLayout>
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="QUICK ACCESS"
                          android:textColor="#B9D7EA"
                          android:textStyle="bold"
                          android:textSize="11sp"
                          android:letterSpacing="0.14"
                          android:paddingTop="20dp"
                          android:paddingBottom="7dp"/>
                      <com.kdt.mcgui.LauncherMenuButton
                          android:id="@+id/custom_control_button"
                          style="@style/LauncherMenuButton.Universal"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/aether_card"
                          android:drawableStart="@drawable/ic_menu_custom_controls"
                          android:text="Controls &amp; Layout"/>
                      <com.kdt.mcgui.LauncherMenuButton
                          android:id="@+id/install_jar_button"
                          style="@style/LauncherMenuButton.Universal"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/aether_card"
                          android:drawableStart="@drawable/ic_menu_install_jar"
                          android:text="Install Mods / JAR"/>
                      <com.kdt.mcgui.LauncherMenuButton
                          android:id="@+id/open_files_button"
                          style="@style/LauncherMenuButton.Universal"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/aether_card"
                          android:drawableStart="@drawable/ic_folder"
                          android:text="Game Files"/>
                      <com.kdt.mcgui.LauncherMenuButton
                          android:id="@+id/news_button"
                          style="@style/LauncherMenuButton.Universal"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/aether_card"
                          android:drawableStart="@drawable/ic_menu_news"
                          android:text="News &amp; Wiki"/>
                      <com.kdt.mcgui.LauncherMenuButton
                          android:id="@+id/discord_button"
                          style="@style/LauncherMenuButton.Universal"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/aether_card"
                          android:drawableStart="@drawable/ic_discord"
                          android:text="Community"/>
                      <com.kdt.mcgui.LauncherMenuButton
                          android:id="@+id/share_logs_button"
                          style="@style/LauncherMenuButton.Universal"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/aether_card"
                          android:drawableStart="@android:drawable/ic_menu_share"
                          android:text="Share Debug Logs"/>
                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="AETHER  •  BUILT FOR JAVA ON ANDROID"
                          android:textColor="#6F8CA8"
                          android:textSize="10sp"
                          android:gravity="center"
                          android:paddingTop="16dp"
                          android:paddingBottom="8dp"/>
                  </LinearLayout>
              </ScrollView>
              <LinearLayout
                  android:id="@+id/aether_bottom_area"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:paddingStart="14dp"
                  android:paddingEnd="14dp"
                  android:paddingTop="8dp"
                  android:paddingBottom="12dp"
                  android:background="#F20D1728"
                  app:layout_constraintBottom_toBottomOf="parent">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <com.kdt.mcgui.mcVersionSpinner
                          android:id="@+id/mc_version_spinner"
                          android:layout_width="0dp"
                          android:layout_height="52dp"
                          android:layout_weight="1"
                          android:background="@drawable/aether_card"
                          android:drawableEnd="@drawable/spinner_arrow"
                          app:drawableEndSize="18dp"
                          app:drawableStartIntegerScaling="true"
                          app:drawableStartSize="34dp"
                          app:drawableEndPadding="4dp"/>
                      <ImageButton
                          android:id="@+id/edit_profile_button"
                          android:layout_width="48dp"
                          android:layout_height="48dp"
                          android:layout_marginStart="8dp"
                          android:background="@drawable/aether_card"
                          android:contentDescription="Edit profile"
                          android:src="@drawable/ic_edit_profile"/>
                  </LinearLayout>
                  <com.kdt.mcgui.MineButton
                      android:id="@+id/play_button"
                      android:layout_width="match_parent"
                      android:layout_height="58dp"
                      android:layout_marginTop="9dp"
                      android:text="PLAY MINECRAFT"
                      android:textAllCaps="true"/>
              </LinearLayout>
              <View
                  android:id="@+id/_background_display_view"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:visibility="gone"/>
          </androidx.constraintlayout.widget.ConstraintLayout>
          """
          (res / "layout/fragment_launcher.xml").write_text(home_xml)
          (res / "layout-land/fragment_launcher.xml").write_text(home_xml)

          PY

      - name: Build APK
        run: |
          cd amethyst
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug

      - name: Upload Aether APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Launcher-APK
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk
