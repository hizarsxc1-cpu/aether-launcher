name: Build Aether Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/amethyst-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Fix Git SSH URLs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Download Amethyst Engine
        run: |
          git clone --branch v3_openjdk --recursive https://github.com/AngelAuraMC/Amethyst-Android.git amethyst

      - name: Rebrand app as Aether
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          res = Path("amethyst/app_pojavlauncher/src/main/res")
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)

          # Create the Aether backgrounds referenced by the patched layouts/theme.
          (drawable / "aether_wallpaper.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="360dp" android:height="800dp"
              android:viewportWidth="360" android:viewportHeight="800">
              <path android:fillColor="#090B20" android:pathData="M0,0h360v800h-360z" />
              <path android:fillColor="#14263A" android:pathData="M0,0h360v800h-360z" />
              <path android:fillColor="#203A50" android:pathData="M0,500 L52,438 L94,470 L154,390 L210,455 L270,372 L360,450 L360,800 L0,800z" />
              <path android:fillColor="#172F43" android:pathData="M0,575 L66,520 L122,548 L188,475 L244,535 L310,480 L360,520 L360,800 L0,800z" />
              <path android:fillColor="#102638" android:pathData="M0,650 L74,590 L132,630 L202,560 L270,615 L330,570 L360,590 L360,800 L0,800z" />
              <path android:fillColor="#0A1D2B" android:pathData="M0,720 L80,660 L142,700 L220,635 L286,690 L360,650 L360,800 L0,800z" />
              <path android:fillColor="#54D5E2" android:pathData="M270,92a28,28 0,1 0,56 0a28,28 0,1 0,-56 0" />
              <path android:fillColor="#D7F8FA" android:pathData="M44,92h4v4h-4z M112,154h3v3h-3z M210,76h4v4h-4z M320,210h3v3h-3z M72,270h3v3h-3z M250,310h4v4h-4z M166,210h3v3h-3z" />
              <path android:fillColor="#0A1B29" android:pathData="M42,650h18v-44h-18z M34,615h34v-20h-34z M38,585h26v-18h-26z M292,632h18v-46h-18z M284,596h34v-20h-34z M288,566h26v-18h-26z" />
          </vector>
          """)
          (drawable / "aether_card.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#E6111230" />
              <stroke android:width="1dp" android:color="#665D43C9" />
              <corners android:radius="14dp" />
          </shape>
          """)
          (drawable / "aether_hero.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="720dp" android:height="380dp"
              android:viewportWidth="720" android:viewportHeight="380">
              <path android:fillColor="#17263C" android:pathData="M0,0h720v380h-720z"/>
              <path android:fillColor="#5B3C55" android:pathData="M0,0h720v380h-720z"/>
              <path android:fillColor="#E78A62" android:pathData="M0,180h720v200h-720z"/>
              <path android:fillColor="#F5C17C" android:pathData="M520,50a54,54 0,1 0,108 0a54,54 0,1 0,-108 0"/>
              <path android:fillColor="#30465A" android:pathData="M0,230l110,-85 92,62 100,-105 112,105 96,-78 110,86 100,-40v205h-720z"/>
              <path android:fillColor="#1D3947" android:pathData="M0,280l100,-50 86,35 102,-74 110,68 95,-42 110,44 117,-58v177h-720z"/>
              <path android:fillColor="#122B35" android:pathData="M0,320l120,-60 90,48 110,-62 105,55 95,-48 100,50 100,-42v119h-720z"/>
              <path android:fillColor="#101F2C" android:pathData="M72,250h18v-42h-18z M62,220h38v-20h-38z M68,190h26v-18h-26z M620,258h20v-50h-20z M608,220h44v-22h-44z M616,188h28v-18h-28z"/>
              <path android:fillColor="#20B7B5" android:pathData="M340,286h52v-82h-52z M328,210h76v-12h-76z M348,192h36v-10h-36z"/>
              <path android:fillColor="#071722" android:pathData="M354,286h8v-70h-8z M370,286h8v-70h-8z"/>
          </vector>
          """)


          # Apply the app name to every language, including Indonesian.
          for p in res.glob("values*/strings.xml"):
              s = p.read_text()
              s = re.sub(
                  r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                  r'\g<1>Aether Launcher\g<2>',
                  s,
                  flags=re.S
              )
              s = s.replace("Amethyst", "Aether Launcher")
              p.write_text(s)

          # Give the launcher a restrained midnight-and-cyan Aether palette.
          colors = res / "values/colors.xml"
          s = colors.read_text()
          palette = {
              "minebutton_color": "#8755F7",
              "background_app": "#090B20",
              "background_overlay": "#191638",
              "background_status_bar": "#0B1420",
              "background_bottom_bar": "#11132D",
              "primary_text": "#F7F3FF",
              "secondary_text": "#B9B3D4",
          }
          for name, value in palette.items():
              s = re.sub(
                  rf'(<color name="{name}">).*?(</color>)',
                  rf'\g<1>{value}\g<2>',
                  s,
                  count=1
              )
          if 'name="aether_icon_background"' not in s:
              s = s.replace("</resources>", '    <color name="aether_icon_background">#101923</color>\n</resources>')
          colors.write_text(s)

          # Carry the Aether accent through the launcher and settings screens.
          styles = res / "values/styles.xml"
          if styles.exists():
              t = styles.read_text()
              anchor = '<item name="preferenceTheme">@style/PreferenceThemeOverlay.v14.Material</item>'
              additions = anchor + '\n        <item name="colorAccent">#12AFC0</item>\n        <item name="colorControlActivated">#12AFC0</item>\n        <item name="android:colorAccent">#12AFC0</item>'
              if 'name="colorAccent"' not in t:
                  t = t.replace(anchor, additions)
              if 'name="android:windowBackground"' not in t:
                  t = t.replace('</style>', '        <item name="android:windowBackground">@drawable/aether_wallpaper</item>\n    </style>', 1)
              styles.write_text(t)

          # Give the account/settings bar the same Aether glass treatment.
          activity_layout = res / "layout/activity_pojav_launcher.xml"
          if activity_layout.exists():
              t = activity_layout.read_text()
              t = t.replace('android:background="@android:color/transparent"', 'android:background="@drawable/aether_wallpaper"', 1)
              t = t.replace('android:dropDownVerticalOffset="@dimen/_52sdp"', 'android:dropDownVerticalOffset="@dimen/_52sdp"\n        android:background="@drawable/aether_card"', 1)
              t = t.replace('android:background="?attr/selectableItemBackground"', 'android:background="@drawable/aether_card"', 1)
              # Add the Aether navigation rail to the activity shell.
              rail = """<LinearLayout
                  android:id="@+id/aether_nav_rail"
                  android:layout_width="68dp"
                  android:layout_height="0dp"
                  android:orientation="vertical"
                  android:gravity="center_horizontal"
                  android:paddingTop="12dp"
                  android:background="#F20B1426"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toBottomOf="parent">
                  <TextView android:layout_width="44dp" android:layout_height="44dp"
                      android:gravity="center" android:text="A" android:textSize="24sp"
                      android:textStyle="bold" android:textColor="#FFFFFF"
                      android:background="@drawable/aether_card"/>
                  <TextView android:id="@+id/aether_nav_home" android:layout_width="match_parent"
                      android:layout_height="64dp" android:layout_marginTop="18dp"
                      android:gravity="center" android:text="⌂&#10;Home" android:textSize="11sp"
                      android:textColor="#65D8E5" android:clickable="true" android:focusable="true"
                      android:background="?attr/selectableItemBackground"/>
                  <TextView android:id="@+id/aether_nav_versions" android:layout_width="match_parent"
                      android:layout_height="64dp" android:gravity="center" android:text="▣&#10;Versions"
                      android:textSize="11sp" android:textColor="#C3D2E5" android:clickable="true"
                      android:focusable="true" android:background="?attr/selectableItemBackground"/>
                  <TextView android:id="@+id/aether_nav_mods" android:layout_width="match_parent"
                      android:layout_height="64dp" android:gravity="center" android:text="▧&#10;Mods"
                      android:textSize="11sp" android:textColor="#C3D2E5" android:clickable="true"
                      android:focusable="true" android:background="?attr/selectableItemBackground"/>
                  <TextView android:id="@+id/aether_nav_controls" android:layout_width="match_parent"
                      android:layout_height="64dp" android:gravity="center" android:text="⌗&#10;Control"
                      android:textSize="11sp" android:textColor="#C3D2E5" android:clickable="true"
                      android:focusable="true" android:background="?attr/selectableItemBackground"/>
                  <TextView android:id="@+id/aether_nav_settings" android:layout_width="match_parent"
                      android:layout_height="64dp" android:gravity="center" android:text="⚙&#10;Settings"
                      android:textSize="11sp" android:textColor="#C3D2E5" android:clickable="true"
                      android:focusable="true" android:background="?attr/selectableItemBackground"/>
                  <TextView android:id="@+id/aether_nav_about" android:layout_width="match_parent"
                      android:layout_height="64dp" android:gravity="center" android:text="ⓘ&#10;About"
                      android:textSize="11sp" android:textColor="#C3D2E5" android:clickable="true"
                      android:focusable="true" android:background="?attr/selectableItemBackground"/>
              </LinearLayout>
              """
              t = t.replace('<com.kdt.mcgui.mcAccountSpinner', rail + '\n    <com.kdt.mcgui.mcAccountSpinner', 1)

              # Correctly size the main content beside the rail.
              def patch_view(xml, tag, view_id, width, extra_attrs):
                  pattern = r"(<" + re.escape(tag) + r"\b[^>]*android:id=\"@\+id/" + re.escape(view_id) + r"\"[^>]*>)"
                  match = re.search(pattern, xml, flags=re.S)
                  if not match:
                      return xml
                  view = match.group(1)
                  view = re.sub(r'android:layout_width="[^"]+"', 'android:layout_width="' + width + '"', view, count=1)
                  for attr, value in extra_attrs.items():
                      if attr in view:
                          view = re.sub(re.escape(attr) + r'="[^"]*"', attr + '="' + value + '"', view, count=1)
                      else:
                          view = view[:-2] + '\n        ' + attr + '="' + value + '" />'
                  return xml[:match.start()] + view + xml[match.end():]

              t = patch_view(t, "com.kdt.mcgui.mcAccountSpinner", "account_spinner", "0dp", {
                  "app:layout_constraintStart_toEndOf": "@id/aether_nav_rail",
                  "app:layout_constraintEnd_toStartOf": "@id/setting_button"})
              t = patch_view(t, "androidx.fragment.app.FragmentContainerView", "container_fragment", "0dp", {
                  "app:layout_constraintStart_toEndOf": "@id/aether_nav_rail",
                  "app:layout_constraintEnd_toEndOf": "parent"})
              t = patch_view(t, "com.kdt.mcgui.ProgressLayout", "progress_layout", "0dp", {
                  "app:layout_constraintStart_toEndOf": "@id/aether_nav_rail",
                  "app:layout_constraintEnd_toEndOf": "parent"})
              activity_layout.write_text(t)

          # Replace the stock home screen with the Aether dashboard while preserving
          # every view ID used by the original launcher logic.
          menu_layout = res / "layout/fragment_launcher.xml"
          if menu_layout.exists():
              menu_layout.write_text("""          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/fragment_menu_main"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/aether_wallpaper">
              <ScrollView
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:fillViewport="true"
                  android:clipToPadding="false"
                  android:padding="12dp"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toTopOf="@id/mc_version_spinner"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">
                      <FrameLayout
                          android:layout_width="match_parent"
                          android:layout_height="190dp"
                          android:background="@drawable/aether_hero">
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:orientation="vertical"
                              android:gravity="bottom"
                              android:padding="18dp"
                              android:background="#66070A20">
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:text="SELAMAT DATANG DI" android:textColor="#E2D8FF"
                                  android:textStyle="bold" android:textSize="12sp"/>
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp" android:text="Aether Launcher"
                                  android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="29sp"/>
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp" android:text="Main Minecraft Java di Android dengan lebih mudah!"
                                  android:textColor="#F0EAFE" android:textSize="13sp"/>
                          </LinearLayout>
                      </FrameLayout>
                      <LinearLayout
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:layout_marginTop="10dp" android:padding="12dp"
                          android:gravity="center_vertical" android:orientation="horizontal"
                          android:background="@drawable/aether_card">
                          <TextView android:layout_width="42dp" android:layout_height="42dp"
                              android:gravity="center" android:text="▦" android:textSize="30sp"
                              android:textColor="#A88BFF"/>
                          <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                              android:layout_weight="1" android:orientation="vertical" android:paddingStart="10dp">
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:text="Mesin Minecraft" android:textColor="#B9A5FF" android:textStyle="bold"/>
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:text="Minecraft Java Edition" android:textColor="#FFFFFF"
                                  android:textStyle="bold" android:textSize="17sp"/>
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:text="Pilih versi lalu mulai bermain" android:textColor="#C9C5DC" android:textSize="12sp"/>
                          </LinearLayout>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="● SIAP" android:textColor="#4BE28A" android:textStyle="bold" android:textSize="11sp"/>
                      </LinearLayout>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:layout_marginTop="16dp" android:layout_marginBottom="8dp"
                          android:text="STATUS SISTEM" android:textColor="#E8E0FF"
                          android:textStyle="bold" android:textSize="12sp"/>
                      <LinearLayout android:id="@+id/aether_status_row"
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical">
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:orientation="horizontal">
                              <TextView android:id="@+id/aether_ram_value" android:layout_width="0dp"
                                  android:layout_height="76dp" android:layout_weight="1" android:gravity="center"
                                  android:textColor="#FFFFFF" android:textSize="13sp" android:background="@drawable/aether_card"/>
                              <TextView android:id="@+id/aether_java_value" android:layout_width="0dp"
                                  android:layout_height="76dp" android:layout_marginStart="8dp" android:layout_weight="1"
                                  android:gravity="center" android:textColor="#FFFFFF" android:textSize="13sp"
                                  android:background="@drawable/aether_card"/>
                          </LinearLayout>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginTop="8dp" android:orientation="horizontal">
                              <TextView android:id="@+id/aether_version_value" android:layout_width="0dp"
                                  android:layout_height="76dp" android:layout_weight="1" android:gravity="center"
                                  android:textColor="#FFFFFF" android:textSize="13sp" android:background="@drawable/aether_card"
                                  android:clickable="true" android:focusable="true"/>
                              <TextView android:id="@+id/aether_renderer_value" android:layout_width="0dp"
                                  android:layout_height="76dp" android:layout_marginStart="8dp" android:layout_weight="1"
                                  android:gravity="center" android:textColor="#FFFFFF" android:textSize="13sp"
                                  android:background="@drawable/aether_card" android:clickable="true" android:focusable="true"/>
                          </LinearLayout>
                      </LinearLayout>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:layout_marginTop="14dp" android:orientation="vertical"
                          android:padding="14dp" android:background="@drawable/aether_card">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="FITUR UNGGULAN" android:textColor="#E8E0FF"
                              android:textStyle="bold" android:textSize="14sp"/>
                          <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginTop="8dp" android:text="✦ Login akun Microsoft melalui menu akun"
                              android:textColor="#E9E5F8" android:padding="3dp"/>
                          <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:text="✦ Dukungan profil Minecraft Java" android:textColor="#E9E5F8" android:padding="3dp"/>
                          <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:text="✦ Instalasi mod dan modloader yang didukung engine" android:textColor="#E9E5F8" android:padding="3dp"/>
                          <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:text="✦ Kontrol sentuh yang dapat dikustomisasi" android:textColor="#E9E5F8" android:padding="3dp"/>
                          <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:text="✦ Pengaturan Java, RAM, video, dan renderer" android:textColor="#E9E5F8" android:padding="3dp"/>
                      </LinearLayout>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:layout_marginTop="10dp" android:orientation="vertical"
                          android:padding="14dp" android:background="@drawable/aether_card">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="INFO &amp; PANDUAN" android:textColor="#E8E0FF"
                              android:textStyle="bold" android:textSize="14sp"/>
                          <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginTop="6dp"
                              android:text="Buka wiki resmi untuk panduan penggunaan, pengaturan, dan pemecahan masalah."
                              android:textColor="#C9C5DC" android:textSize="12sp"/>
                          <Button android:id="@+id/aether_news_more" android:layout_width="match_parent"
                              android:layout_height="48dp" android:layout_marginTop="8dp"
                              android:text="BUKA AETHER WIKI" android:textColor="#FFFFFF"
                              android:background="@drawable/aether_card"/>
                      </LinearLayout>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:layout_marginTop="10dp" android:orientation="horizontal">
                          <Button android:id="@+id/news_button" android:layout_width="0dp"
                              android:layout_height="48dp" android:layout_weight="1"
                              android:text="Wiki" android:textColor="#FFFFFF" android:background="@drawable/aether_card"/>
                          <Button android:id="@+id/discord_button" android:layout_width="0dp"
                              android:layout_height="48dp" android:layout_marginStart="8dp" android:layout_weight="1"
                              android:text="Community" android:textColor="#FFFFFF" android:background="@drawable/aether_card"/>
                      </LinearLayout>
                      <Button android:id="@+id/custom_control_button" android:layout_width="match_parent"
                          android:layout_height="48dp" android:layout_marginTop="8dp"
                          android:text="Custom Controls" android:textColor="#FFFFFF" android:background="@drawable/aether_card"/>
                      <Button android:id="@+id/install_jar_button" android:layout_width="match_parent"
                          android:layout_height="48dp" android:layout_marginTop="8dp"
                          android:text="Install JAR / Mod" android:textColor="#FFFFFF" android:background="@drawable/aether_card"/>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:layout_marginTop="8dp" android:orientation="horizontal">
                          <Button android:id="@+id/share_logs_button" android:layout_width="0dp"
                              android:layout_height="46dp" android:layout_weight="1"
                              android:text="Share Logs" android:textColor="#FFFFFF" android:background="@drawable/aether_card"/>
                          <Button android:id="@+id/open_files_button" android:layout_width="0dp"
                              android:layout_height="46dp" android:layout_marginStart="8dp" android:layout_weight="1"
                              android:text="Game Files" android:textColor="#FFFFFF" android:background="@drawable/aether_card"/>
                      </LinearLayout>
                  </LinearLayout>
              </ScrollView>
              <com.kdt.mcgui.mcVersionSpinner android:id="@+id/mc_version_spinner"
                  android:layout_width="0dp" android:layout_height="50dp"
                  android:background="@drawable/aether_card" android:drawableEnd="@drawable/spinner_arrow"
                  app:drawableEndSize="@dimen/padding_heavy" app:drawableStartIntegerScaling="true"
                  app:drawableStartSize="@dimen/_36sdp" app:drawableEndPadding="@dimen/_1sdp"
                  app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toStartOf="@id/edit_profile_button"
                  app:layout_constraintBottom_toTopOf="@id/play_button"/>
              <ImageButton android:id="@+id/edit_profile_button" android:layout_width="50dp"
                  android:layout_height="50dp" android:background="@drawable/aether_card"
                  android:src="@drawable/ic_edit_profile" android:contentDescription="Edit Minecraft profile"
                  app:layout_constraintEnd_toEndOf="parent" app:layout_constraintBottom_toBottomOf="@id/mc_version_spinner"
                  app:layout_constraintTop_toTopOf="@id/mc_version_spinner"/>
              <com.kdt.mcgui.MineButton android:id="@+id/play_button"
                  android:layout_width="match_parent" android:layout_height="58dp"
                  android:layout_marginHorizontal="12dp" android:layout_marginBottom="10dp"
                  android:textAllCaps="true" android:text="MULAI BERMAIN"
                  app:layout_constraintBottom_toBottomOf="parent"/>
          </androidx.constraintlayout.widget.ConstraintLayout>
          """)
          
          # Add working skin/cape buttons inside the dashboard feature card.
          if menu_layout.exists():
              dashboard = menu_layout.read_text().lstrip()
              skin_button = """<Button
                              android:id="@+id/aether_skin_button"
                              android:layout_width="match_parent"
                              android:layout_height="50dp"
                              android:layout_marginTop="10dp"
                              android:text="IMPORT SKIN OFFLINE"
                              android:textColor="#FFFFFF"
                              android:background="@drawable/aether_card"/>"""
              cape_button = """<Button
                              android:id="@+id/aether_cape_button"
                              android:layout_width="match_parent"
                              android:layout_height="50dp"
                              android:layout_marginTop="8dp"
                              android:text="AETHER CAPE"
                              android:textColor="#FFFFFF"
                              android:background="@drawable/aether_card"/>"""
              # The heading is a stable anchor in the custom dashboard XML.
