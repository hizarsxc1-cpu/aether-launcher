name: Build Aether Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/amethyst-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Fix Git SSH URLs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Download Amethyst Engine
        run: |
          git clone --branch v3_openjdk --recursive https://github.com/AngelAuraMC/Amethyst-Android.git amethyst

      - name: Rebrand app as Aether
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("amethyst/app_pojavlauncher/src/main/res/values/strings.xml")
          s = p.read_text()
          s = s.replace('<string name="app_name" translatable="false">Amethyst</string>', '<string name="app_name" translatable="false">Aether Launcher</string>')
          s = s.replace('<string name="app_short_name" translatable="false">Amethyst</string>', '<string name="app_short_name" translatable="false">Aether</string>')
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd amethyst
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug

      - name: Upload Aether APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Launcher-APK
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk
