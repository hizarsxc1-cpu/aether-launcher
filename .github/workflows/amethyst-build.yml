name: Build Aether Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/amethyst-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Fix Git SSH URLs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Download Amethyst Engine
        run: |
          git clone --branch v3_openjdk --recursive https://github.com/AngelAuraMC/Amethyst-Android.git amethyst

      - name: Rebrand app as Aether
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          res = Path("amethyst/app_pojavlauncher/src/main/res")

          # Apply the app name to every language, including Indonesian.
          for p in res.glob("values*/strings.xml"):
              s = p.read_text()
              s = re.sub(
                  r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                  r'\g<1>Aether Launcher\g<2>',
                  s,
                  flags=re.S
              )
              s = s.replace("Amethyst", "Aether Launcher")
              p.write_text(s)

          # Give the launcher a restrained midnight-and-cyan Aether palette.
          colors = res / "values/colors.xml"
          s = colors.read_text()
          palette = {
              "minebutton_color": "#12AFC0",
              "background_app": "#101923",
              "background_overlay": "#263744",
              "background_status_bar": "#0B1420",
              "background_bottom_bar": "#15232F",
              "primary_text": "#F4FAFC",
              "secondary_text": "#A9BBC5",
          }
          for name, value in palette.items():
              s = re.sub(
                  rf'(<color name="{name}">).*?(</color>)',
                  rf'\g<1>{value}\g<2>',
                  s,
                  count=1
              )
          if 'name="aether_icon_background"' not in s:
              s = s.replace("</resources>", '    <color name="aether_icon_background">#101923</color>\n</resources>')
          colors.write_text(s)

          # Replace the stock Amethyst adaptive launcher icon with an original Aether mark.
          foreground = res / "drawable/ic_aether_foreground.xml"
          foreground.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#12AFC0"
                  android:pathData="M54,15 L91,88 L76,88 L54,45 L32,88 L17,88 Z"/>
              <path android:fillColor="#F4FAFC"
                  android:pathData="M39,66 L69,66 L76,79 L32,79 Z"/>
              <path android:fillColor="#101923"
                  android:pathData="M49,56 L59,56 L65,68 L43,68 Z"/>
          </vector>
          """)
          adaptive = res / "mipmap-anydpi-v26/ic_launcher.xml"
          adaptive.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/aether_icon_background"/>
              <foreground android:drawable="@drawable/ic_aether_foreground"/>
          </adaptive-icon>
          """)
          # Keep the round adaptive icon consistent as well.
          round_icon = res / "mipmap-anydpi-v26/ic_launcher_round.xml"
          if round_icon.exists():
              round_icon.write_text(adaptive.read_text())
          # Aether visual layer: a deep twilight gradient and softer glass-like panels.
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "aether_wallpaper.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape android:shape="rectangle"><gradient android:angle="135" android:startColor="#080F20" android:centerColor="#17233D" android:endColor="#090D1B" android:type="linear"/></shape></item>
              <item android:gravity="top|right"><shape android:shape="rectangle"><size android:width="220dp" android:height="220dp"/><corners android:bottomLeftRadius="220dp"/><solid android:color="#302B55A8"/></shape></item>
              <item android:gravity="bottom|left"><shape android:shape="rectangle"><size android:width="260dp" android:height="260dp"/><corners android:topRightRadius="260dp"/><solid android:color="#302A1C66"/></shape></item>
          </layer-list>""")
          (drawable / "aether_panel.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="12dp"/>
              <gradient android:angle="135" android:startColor="#D91C2C4A" android:endColor="#D9101A30"/>
              <stroke android:width="1dp" android:color="#554C8DFF"/>
          </shape>""")
          # Keep the launcher controls and navigation intact; only refresh their visual surfaces.
          for layout in [
              res / "layout/fragment_launcher.xml",
              res / "layout-land/fragment_launcher.xml",
          ]:
              if layout.exists():
                  s = layout.read_text()
                  s = s.replace('android:background="@color/background_app"', 'android:background="@drawable/aether_wallpaper"', 1)
                  layout.write_text(s)

          PY

      - name: Build APK
        run: |
          cd amethyst
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug

      - name: Upload Aether APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Launcher-APK
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk
