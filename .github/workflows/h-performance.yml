name: Build H Performance
on:
  push:
    branches: [h-performance-mod]
    paths:
      - 'mods/h-performance/**'
      - '.github/workflows/h-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod JAR
        working-directory: mods/h-performance
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: H-Performance-Fabric-1.21
          path: |
            mods/h-performance/build/libs/*.jar
            !mods/h-performance/build/libs/*-sources.jar
